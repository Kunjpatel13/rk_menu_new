<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/admin.css">
</head>

    <body class="login-page">
        <main class="login-card">
            <div class="admin-logo p-1"><img src="../img/RK food_logo_black.png" alt="RK Food"
                    style="width:100%;height:100%;object-fit:contain;border-radius:12px;"></div><span
                class="eyebrow">RESTAURANT MANAGEMENT</span>
            <h1>Welcome back</h1>
            <p class="text-muted">Sign in to manage your restaurant menu.</p>
            <form id="loginForm"><label class="form-label" for="email">Admin email</label><input
                    class="form-control mb-3" type="email" id="email" autocomplete="username" required><label
                    class="form-label" for="password">Password</label><input class="form-control mb-3" type="password"
                    id="password" autocomplete="current-password" required>
                <div id="loginError" class="alert alert-danger d-none"></div><button class="btn btn-admin w-100"
                    type="submit" id="loginBtn">Sign in <i class="bi bi-arrow-right ms-2"></i></button>
            </form><a href="../index.html" class="back-link"><i class="bi bi-arrow-left me-1"></i> Back to website</a>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="../js/config.js"></script>
        <script src="../js/admin-auth.js"></script>
    </body>

</html>
